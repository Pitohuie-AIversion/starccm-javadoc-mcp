name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release Assets
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Check MCP server
        run: node scripts/regression-test.mjs

      - name: Build Windows GUI & Package GUI Release
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP 'starccm-release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File .\package-gui.ps1 -OutputPath (Join-Path $releaseDir 'starccm-javadoc-codex-gui.zip')
          if ($LASTEXITCODE -ne 0) { throw 'GUI packaging failed.' }

      - name: Package CLI Distribution
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP 'starccm-release'
          $stage = Join-Path $env:RUNNER_TEMP ('starccm-cli-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $stage | Out-Null
          $cliFiles = @('LICENSE','README.md','README-Codex.zh-CN.md','CHECKS.md','package.json','package-lock.json','pnpm-lock.yaml','server.mjs','deploy-codex.ps1')
          $cliFiles += @('lib/extract.mjs','lib/javadoc.mjs','scripts/Executables.psm1','scripts/Javadoc.psm1','scripts/Registration.psm1','scripts/regression-test.mjs','scripts/smoke-test.mjs')
          $cliFiles += @('tests/arguments.ps1','tests/executable-timeout.ps1','tests/registration.ps1','tests/verify.ps1')
          foreach ($relative in $cliFiles) {
              $destination = Join-Path $stage $relative
              New-Item -ItemType Directory -Path (Split-Path $destination -Parent) -Force | Out-Null
              Copy-Item -LiteralPath (Join-Path $PWD $relative) -Destination $destination
          }
          $zip = Join-Path $releaseDir 'starccm-javadoc-codex.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($stage, $zip)
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
              foreach ($relative in $cliFiles) {
                  if (-not $archive.GetEntry($relative)) { throw "Missing archive entry: $relative" }
              }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          [IO.File]::WriteAllText(($zip + '.sha256'), "$hash  $([IO.Path]::GetFileName($zip))`n")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/starccm-release/starccm-javadoc-codex-gui.zip
            ${{ runner.temp }}/starccm-release/starccm-javadoc-codex-gui.zip.sha256
            ${{ runner.temp }}/starccm-release/starccm-javadoc-codex.zip
            ${{ runner.temp }}/starccm-release/starccm-javadoc-codex.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
